<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MongoDB Terminal Practice</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #17212b;
        background: #f3f6f8;
      }

      body {
        max-width: 760px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      main {
        padding: 32px;
        border: 1px solid #dce3e8;
        border-radius: 12px;
        background: #fff;

      }

      h1 {
        margin-top: 0;
        color: #14532d;
      }

      a {
        color: #0969da;
      }

      .button {
        display: inline-block;
        margin: 12px 0;
        padding: 12px 18px;
        border-radius: 8px;
        background: #176b3a;
        color: #fff;
        font-weight: 650;
        text-decoration: none;
      }

        background: #12552e;
      }
    </style>

  <body>
    <main>
      <h1>MongoDB Terminal Practice</h1>
      <p>
        This report summarizes MongoDB CRUD commands, query operators, and a

        View or download the practice report (PDF)
      </a>
      <p>
